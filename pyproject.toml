[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
cache_dir = "/tmp/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Correctness gate for the recovered codebase. Style rules can be tightened
# incrementally without hiding functional failures behind a large legacy diff.
select = ["E9", "F"]
