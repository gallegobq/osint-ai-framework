services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-osint_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: linterna/ollama:2026.09.18
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=http://127.0.0.1:11434 ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1 && OLLAMA_HOST=http://127.0.0.1:11434 ollama show "$${RAG_EMBEDDING_MODEL}" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 10s

  sandbox:
    image: linterna/sandbox:2026.09.18
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      SANDBOX_SOCKET_TIMEOUT_SECONDS: ${SOC_SANDBOX_TIMEOUT_SECONDS:-10}
    networks:
      - sandbox_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: linterna/api:2026.09.18
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      AUTH_COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    networks:
      - default
      - sandbox_egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.00

  migrate:
    image: linterna/api:2026.09.18
    command: ["migrate"]
    restart: "no"
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    image: linterna/api:2026.09.18
    restart: unless-stopped
    command: ["celery", "--app=app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      SOC_SANDBOX_ENABLED: ${SOC_SANDBOX_ENABLED:-true}
      SOC_SANDBOX_URL: http://sandbox:8090
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    networks:
      - default
      - sandbox_egress
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.00

  scheduler:
    image: linterna/api:2026.09.18
    restart: unless-stopped
    command: ["celery", "--app=app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  sandbox_egress:
